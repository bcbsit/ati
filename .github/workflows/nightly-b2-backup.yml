name: Nightly B2 Backup

on:
  schedule:
    # Run every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0

      - name: Create backup tarball
        run: |
          BACKUP_NAME="repo-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
          tar --exclude='.git/objects' -czf "$BACKUP_NAME" .
          echo "BACKUP_FILE=$BACKUP_NAME" >> $GITHUB_ENV

      - name: Upload to Backblaze B2
        env:
          B2_APP_KEY_ID: ${{ secrets.B2_APP_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          # Install b2 CLI
          pip install b2

          # Authorize with B2
          b2 account-info authorize-account "$B2_APP_KEY_ID" "$B2_APP_KEY"

          # Upload backup
          b2 file upload --noProgress "$B2_BUCKET_NAME" "${{ env.BACKUP_FILE }}" "${{ env.BACKUP_FILE }}"

          # Log success
          echo "Backup uploaded: ${{ env.BACKUP_FILE }}"

      - name: Clean up old backups (keep last 7)
        env:
          B2_APP_KEY_ID: ${{ secrets.B2_APP_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        run: |
          b2 account-info authorize-account "$B2_APP_KEY_ID" "$B2_APP_KEY"
          # List files in reverse chronological order, skip first 7, delete the rest
          b2 ls --long --recursive "$B2_BUCKET_NAME" | sort -r | tail -n +8 | awk '{print $1, $NF}' | while read file_id file_name; do
            if [ ! -z "$file_id" ] && [ ! -z "$file_name" ]; then
              b2 file delete --fileId "$file_id" "$B2_BUCKET_NAME" "$file_name"
              echo "Deleted old backup: $file_name"
            fi
          done
